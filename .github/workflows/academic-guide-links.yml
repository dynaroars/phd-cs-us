name: Maintain academic guide links

on:
  schedule:
    - cron: '23 9 * * 2,5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      check_models:
        description: Check both Copilot models without opening an issue or editing the guides
        type: boolean
        default: false

permissions: {}

concurrency:
  group: academic-guide-links
  cancel-in-progress: false

env:
  SCOUT_MODEL: claude-haiku-4.5
  AUDIT_MODEL: gpt-5.3-codex
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  discover:
    if: github.repository == 'dynaroars/phd-cs-us' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
      copilot-requests: write
    outputs:
      candidates: ${{ steps.scout.outputs.candidates }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: npm install --global @github/copilot@1.0.114
      - name: Check model access
        if: inputs.check_models == true
        run: python3 .github/scripts/maintain_links.py check-models
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.ACADEMIC_GUIDE_COPILOT_TOKEN || github.token }}
      - name: Find and shortlist resources
        id: scout
        if: inputs.check_models != true
        run: python3 .github/scripts/maintain_links.py scout
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.ACADEMIC_GUIDE_COPILOT_TOKEN || github.token }}

  record:
    needs: discover
    if: needs.discover.outputs.candidates != '' && needs.discover.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      number: ${{ steps.issue.outputs.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Open a candidate review issue
        id: issue
        run: python3 .github/scripts/maintain_links.py issue
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES: ${{ needs.discover.outputs.candidates }}

  audit:
    needs: [discover, record]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      approved: ${{ steps.audit.outputs.approved }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: npm install --global @github/copilot@1.0.114
      - name: Verify sources and audit the shortlist
        id: audit
        run: python3 .github/scripts/maintain_links.py audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.ACADEMIC_GUIDE_COPILOT_TOKEN || github.token }}
          CANDIDATES: ${{ needs.discover.outputs.candidates }}

  publish:
    needs: [record, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Add approved links and close the review issue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/maintain_links.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ needs.audit.outputs.approved }}
          ISSUE_NUMBER: ${{ needs.record.outputs.number }}
